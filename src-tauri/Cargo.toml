[package]
name = "deepshell-agent"
version = "0.1.0"
description = "A desktop agent powered by DeepSeek Harness."
license = "MIT"
edition = "2021"
build = "build.rs"

[lib]
name = "deepshell_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
libc = "0.2"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[features]
default = []
poc-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3"
